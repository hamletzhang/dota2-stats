<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dota2 战绩查询</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="logo"><b>D2</b><span> 战绩查询</span></div>
    <form class="search" id="search">
      <input class="input" id="q" inputmode="numeric" autocomplete="off" placeholder="输入 Steam 数字 ID（Account ID）" aria-label="Account ID">
      <button class="btn primary" type="submit">查询</button>
      <button class="btn" type="button" id="refresh" title="请求 OpenDota 重新解析该玩家">刷新</button>
    </form>
  </div>
</header>

<main class="wrap">
  <div id="player"></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="matches">最近比赛</button>
    <button role="tab" data-tab="heroes">英雄统计</button>
    <button role="tab" data-tab="peers">队友</button>
    <button role="tab" data-tab="compare">对比</button>
  </nav>
  <section class="panel" id="panel" role="tabpanel"></section>
</main>
<footer class="wrap footer">数据来源：<a href="https://www.opendota.com" target="_blank" rel="noopener noreferrer">OpenDota</a> · 仅供个人使用</footer>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
